
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Iniciar processo de adoção</title>
</head>
<body>
    <h1>Iniciar processo de adoção</h1>

    <p>
        <strong>Animal selecionado:</strong> {{ animal.nome }}
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Iniciar processo</button>
    </form>

    <a href="{% url 'listar_animais' %}">Cancelar</a>
</body>
</html>
