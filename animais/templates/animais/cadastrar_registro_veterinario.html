<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Registro Veterinário</title>
</head>
<body>
    {% include 'animais/controles_acessibilidade.html' %}
    <h1>Novo Registro Veterinário</h1>

    <h2>Animal: {{ animal.nome }}</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Salvar registro</button>
    </form>

    <a href="{% url 'listar_registros_veterinarios' animal.id %}">
        Cancelar
    </a>
</body>
</html>
